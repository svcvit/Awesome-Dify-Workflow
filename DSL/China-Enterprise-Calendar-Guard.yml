    - data:
        code: "from datetime import date, timedelta\n\n# Official 2026 public-holiday\
          \ schedule, 国办发明电〔2025〕7号 (published 2025-11-04).\n# Each entry: (start,\
          \ end, english_name)\nHOLIDAY_RANGES_2026 = [\n    (\"2026-01-01\", \"2026-01-03\"\
          , \"New Year's Day\"),\n    (\"2026-02-15\", \"2026-02-23\", \"Spring Festival\"\
          ),\n    (\"2026-04-04\", \"2026-04-06\", \"Qingming Festival\"),\n    (\"\
          2026-05-01\", \"2026-05-05\", \"Labour Day\"),\n    (\"2026-06-19\", \"\
          2026-06-21\", \"Dragon Boat Festival\"),\n    (\"2026-09-25\", \"2026-09-27\"\
          , \"Mid-Autumn Festival\"),\n    (\"2026-10-01\", \"2026-10-07\", \"National\
          \ Day\"),\n]\n\n# 调休 makeup workdays: calendar weekend days that are official\
          \ working days in 2026.\nMAKEUP_WORKDAYS_2026 = [\n    \"2026-01-04\", \
          \ # Sun  - swapped for New Year\n    \"2026-02-14\",  # Sat  - swapped for\
          \ Spring Festival\n    \"2026-02-28\",  # Sat  - swapped for Spring Festival\n\
          \    \"2026-05-09\",  # Sat  - swapped for Labour Day\n    \"2026-09-20\"\
          ,  # Sun  - swapped for National Day\n    \"2026-10-10\",  # Sat  - swapped\
          \ for National Day\n]\n\n\ndef main(date_text: str, confidence: str) ->\
          \ dict:\n    # --- 1. Defensive parse: never let a bad LLM output crash\
          \ the workflow.\n    raw = (date_text or \"\").strip().strip('\"').strip(\"\
          '\")\n    if not raw or raw.lower() in (\"none\", \"null\"):\n        return\
          \ {\n            \"is_valid_meeting_day\": False,\n            \"date\"\
          : None,\n            \"day_kind\": \"unresolved\",\n            \"message\"\
          : \"Could not determine a specific date. Please restate it as YYYY-MM-DD.\"\
          ,\n        }\n\n    try:\n        target = date.fromisoformat(raw)\n   \
          \ except ValueError:\n        return {\n            \"is_valid_meeting_day\"\
          : False,\n            \"date\": raw,\n            \"day_kind\": \"unparseable\"\
          ,\n            \"message\": f\"'{raw}' is not a valid YYYY-MM-DD date.\"\
          ,\n        }\n\n    iso = target.isoformat()\n    is_weekend_day = target.weekday()\
          \ >= 5  # Sat=5, Sun=6\n\n    # --- 2. Is it an official holiday?\n    holiday_name\
          \ = None\n    for start_s, end_s, name in HOLIDAY_RANGES_2026:\n       \
          \ if date.fromisoformat(start_s) <= target <= date.fromisoformat(end_s):\n\
          \            holiday_name = name\n            break\n\n    # --- 3. The\
          \ whole point: a calendar weekend that is actually a working day.\n    is_makeup_workday\
          \ = iso in MAKEUP_WORKDAYS_2026\n\n    # --- 4. Decide.\n    if is_makeup_workday:\n\
          \        day_kind = \"makeup_workday\"\n        ok = False\n        message\
          \ = (\n            f\"{iso} is a Saturday/Sunday but a 调休 makeup working\
          \ day. \"\n            f\"It LOOKS like a weekend and is NOT. Do not book.\"\
          \n        )\n    elif holiday_name is not None:\n        day_kind = \"public_holiday\"\
          \n        ok = False\n        message = f\"{iso} falls in the {holiday_name}\
          \ public holiday. Office is closed.\"\n    elif is_weekend_day:\n      \
          \  day_kind = \"weekend\"\n        ok = False\n        message = f\"{iso}\
          \ is a regular weekend. Do not book.\"\n    else:\n        day_kind = \"\
          workday\"\n        ok = True\n        message = f\"{iso} is a normal working\
          \ day. Safe to schedule.\"\n\n    # --- 5. Surface low confidence so the\
          \ caller can double-check.\n    needs_review = str(confidence).strip().lower()\
          \ != \"high\"\n\n    return {\n        \"is_valid_meeting_day\": ok,\n \
          \       \"date\": iso,\n        \"weekday\": target.strftime(\"%A\"),\n\
          \        \"day_kind\": day_kind,\n        \"holiday_name\": holiday_name\
          \ or \"\",\n        \"is_makeup_workday\": is_makeup_workday,\n        \"\
          needs_human_review\": needs_review,\n        \"message\": message,\n   \
          \ }\n"
        code_language: python3
        outputs:
          date:
            children: null
            type: string
          day_kind:
            children: null
            type: string
          holiday_name:
            children: null
            type: string
          is_makeup_workday:
