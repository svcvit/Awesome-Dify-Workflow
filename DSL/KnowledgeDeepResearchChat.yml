    name: param_topic
    selector:
    - conversation
    - param_topic
    value: ''
    value_type: string
  - description: This value determines how many sources to explore.
    id: b5170aa5-9a6c-442a-adac-d55fd74708d6
    name: param_breadth
    selector:
    - conversation
    - param_breadth
    value: 0
    value_type: number
  - description: 'This value determines how many sub-queries to generate.

      定义生成多少子查询。'
