app:
  description: Need change environment variables API Secret key for KnowledgeDeepResearchLearn.
  icon: 🔁
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: KnowledgeDeepResearchChat
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
